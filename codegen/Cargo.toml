[package]
name = "bridge-codegen"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "gen-types"
path = "src/main.rs"

[[bin]]
name = "gen-proto-types"
path = "src/proto_gen.rs"

[[bin]]
name = "gen-operations"
path = "src/gen_operations.rs"

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "parsing", "visit", "visit-mut"] }
walkdir = "2.5.0"
