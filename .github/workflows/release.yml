name: Release

# release-please keeps a release PR up to date with every conventional commit
# landing on main. Merging that PR tags the release, which is the only thing
# that triggers a publish — so the version bump stays reviewable instead of
# firing on each merge.
#
# Commit types matter now: only feat/fix/perf produce a release. A `chore(deps):
# …` bump of the whatsapp-rust pin releases nothing and would sit on main until
# an unrelated commit dragged it out — commit those as `fix(deps): …` instead.
on:
  push:
    branches: [main]
  # Recovery path. A release tag is created by the job below and only that run
  # carries `release_created`, so a publish that fails for a reason outside the
  # tag — a missing tool on the runner, a registry outage — cannot be retried by
  # re-running it: the re-run replays the workflow file of that commit, which is
  # the one that failed.
  #
  # Dispatch this **with the release tag selected as the ref**, not from a
  # branch with the tag as a parameter. Taking it as a free-form input would let
  # a dispatch publish any branch or commit through a job holding npm OIDC
  # rights, and npm's provenance records the event's ref and sha rather than
  # whatever the workspace was checked out to — so a tarball built from a tag
  # while the event pointed at a branch would be attested to the wrong commit.
  # The ref picker only offers refs that exist, and `ref_type` below rejects
  # everything that is not a tag.
  #
  # The consequence, which is the price of the above: a dispatch runs the
  # workflow file stored in the selected tag, so this only rescues tags created
  # from this commit onwards. A tag older than this file has no dispatch trigger
  # to select and cannot be recovered here — delete it along with its GitHub
  # release and let the next release supersede it, since a tag that never
  # reached npm has nothing depending on it.
  workflow_dispatch:

permissions:
  contents: read

# One group for every release and recovery run, not one per ref: a recovery
# dispatched on a tag has a different `github.ref` than a release from main, so
# keying on it would let the two reach `npm publish` at the same time and race
# over which one `latest` ends up pointing at.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: nightly-2026-04-05
  NODE_VERSION: 24

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels the release PR, and PR labels go through the
      # issues API. Only matters on the GITHUB_TOKEN fallback path — the App
      # token below carries its own permissions.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A pull request opened with GITHUB_TOKEN gets its checks queued in an
      # approval-required state, so the release PR sits there until a maintainer
      # clicks "Approve and run". An App installation token is the supported way
      # out: it is minted per run and expires in an hour, unlike the PAT the
      # same workaround used to require.
      #
      # Entirely optional — set the RELEASE_APP_CLIENT_ID variable and the
      # RELEASE_APP_PRIVATE_KEY secret to switch it on. Without them this falls
      # back to GITHUB_TOKEN and releases still work, they just need that click.
      # The App needs Contents, Pull requests and Issues: read and write.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits everything the App installation
          # holds, and job-level `permissions` do not constrain it. Scoping here
          # keeps this token narrow even if the App is later granted more for
          # some other purpose.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Split from publish on purpose: this is where the test suites and the wasm
  # toolchain run, and none of it should be able to reach an OIDC token. The job
  # below still has to build (dist/ is gitignored and is the whole package), but
  # it runs nothing beyond that build and the publish itself.
  verify:
    name: Verify the tag
    needs: release-please
    # `!cancelled()` rather than `always()`: the dispatch path needs this to run
    # past a skipped release-please, but a cancelled run must not go on to
    # publish.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the event recorded, never a ref. A ref can move between
          # the event and either checkout, and npm records this sha as the
          # package's source regardless of what the workspace holds — so
          # resolving a tag here could publish one tree while attesting another.
          ref: ${{ github.sha }}
          persist-credentials: false

      # `ref_type == 'tag'` only proves the ref is a tag, not that it is a
      # release. Without this, anyone able to push a tag could point the job
      # holding npm OIDC rights at arbitrary code, bypassing main entirely.
      # A GitHub release is what release-please creates and what a hand-pushed
      # tag does not have; the version match then ties the tag to the tree.
      - name: Confirm the dispatch targets a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub release; only release tags can be published"
            exit 1
          fi

          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match package.json version $version"
            exit 1
          fi

          # npm refuses to apply `latest` implicitly once the registry holds a
          # higher version, so a recovery attempted after a newer release would
          # fail at the publish step — after the whole build. Say so here.
          name=$(jq -r .name package.json)
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$version" ] &&
             [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::$name@$latest is already published; $version cannot take latest implicitly"
            exit 1
          fi

      # Guards the assumption on the push path: release-please tags the commit
      # it just merged, so a tag pointing elsewhere means this run would verify
      # and publish something the release does not name.
      - name: Confirm the release tag points at this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          target=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = tag ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')
          fi
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $target, not $GITHUB_SHA"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          # protoc: `bun run build` regenerates the proto codec, which ci.yml
          # never exercises because it calls wasm-pack and build:ts directly.
          tool: wasm-pack,protoc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install

      # Whether or not the release PR got its checks approved, the tag faces the
      # same bar as a normal pull request before anything reaches npm.
      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build the wasm package
        run: bun run build

      - run: bun test

      - name: Rust unit tests (wasm32 in Node)
        run: bun run test:rust

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Gate for the publish step: add required reviewers here to make releases
    # need a second pair of eyes, and to scope the OIDC trust on npm.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights. No
      # long-lived NPM_TOKEN lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same immutable commit verify checked out and vouched for.
          ref: ${{ github.sha }}
          # Nothing here talks to the remote after checkout, and the steps below
          # run cargo, bun and third-party build scripts in a job holding OIDC
          # publish rights. Don't leave the token in .git/config for them.
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          # protoc: `bun run build` regenerates the proto codec, which ci.yml
          # never exercises because it calls wasm-pack and build:ts directly.
          tool: wasm-pack,protoc

      # Pinned, unlike ci.yml: this bun builds the wasm artifact that ships to
      # npm, so a floating version would change the published bytes without a
      # change to this repository.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm >= 11.5.1, above what some Node 24 releases
      # bundle. Pinned rather than `@latest`: this binary performs the publish
      # with the OIDC token, so it is part of the privileged path and a floating
      # tag would put unreviewed code there.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # Everything already passed in `verify`; this job re-runs only the build,
      # because `files` ships dist/ and dist/ is gitignored — the tarball is
      # whatever this step produces. That does mean the build toolchain still
      # executes alongside the token: publishing a package whose entire content
      # is generated cannot avoid that without handing a prebuilt tarball to
      # npm, which is not the shape npm documents provenance against.
      - run: bun install --ignore-scripts

      - name: Build the wasm package
        run: bun run build

      # `--ignore-scripts` below suppresses the prepack hook, and prepack is
      # where the tarball guard lives — run it directly so a build that leaks
      # pkg/ or duplicate files still fails before publishing.
      - name: Check the tarball contents
        run: bun run scripts/check-pack.ts

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing authenticates
      # over OIDC and attaches provenance on its own.
      - run: npm publish --ignore-scripts
