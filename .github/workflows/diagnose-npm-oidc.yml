name: Diagnose npm OIDC

# Temporary. Reproduces the publish job's environment and permissions without
# publishing, to tell "npm never attempted OIDC" apart from "npm attempted it
# and the registry refused". Delete once the publish path is proven.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # `:+set` prints a marker, never the value: the OIDC request token is a
      # credential.
      - name: Report what publish would see
        run: |
          echo "node            $(node --version)"
          echo "npm             $(npm --version)  ($(command -v npm))"
          echo "OIDC url        ${ACTIONS_ID_TOKEN_REQUEST_URL:+set}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING}"
          echo "OIDC token      ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-MISSING}"
          echo "registry        $(npm config get registry)"
          echo "--- npmrc files ---"
          for f in ./.npmrc ~/.npmrc /usr/local/etc/npmrc; do
            [ -f "$f" ] && { echo "$f:"; sed 's/=.*/=<redacted>/' "$f"; } || echo "$f: absent"
          done

      # The decisive test: perform the exchange npm would perform, and print the
      # registry's answer. A dry-run publish does not authenticate, so it cannot
      # tell a missing trust config apart from a CLI that never tried.
      #
      # Prints status and body, never the tokens: the request token is a
      # credential, and a successful exchange returns a publish token.
      - name: Exchange the OIDC token by hand
        run: |
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          if [ -z "$id_token" ] || [ "$id_token" = null ]; then
            echo "::error::GitHub did not return an id token for audience npm:registry.npmjs.org"
            exit 1
          fi
          echo "id token obtained; claims (no signature):"
          echo "$id_token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, repository, workflow_ref, environment, job_workflow_ref}' || true

          # Controlled comparison. baileyrs is known to have no trusted
          # publisher configured, so if it answers exactly like this package
          # does, the message is npm's way of saying "no trust config for this
          # package" rather than anything about the package existing.
          for pkg in '@oxidezap%2fwhatsapp-rust-bridge' '@oxidezap%2Fwhatsapp-rust-bridge' '@oxidezap%2fbaileyrs'; do
            code=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")
            echo "$pkg -> HTTP $code $(jq -c 'del(.token)' /tmp/exchange.json 2>/dev/null || cat /tmp/exchange.json)"
          done
