[package]
name = "bridge-codegen"
version = "0.1.0"
edition = "2024"
publish = false

# The bridge became a workspace, and `gen:bridge-types` runs cargo from inside
# this directory. Listing `codegen` in the root's `workspace.exclude` does not
# cover that invocation — cargo still walks up, finds the root manifest and
# rejects the package as a non-member. Its own workspace root settles it.
[workspace]

[[bin]]
name = "gen-types"
path = "src/main.rs"

[[bin]]
name = "gen-proto-types"
path = "src/proto_gen.rs"

[[bin]]
name = "gen-operations"
path = "src/gen_operations.rs"

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full", "parsing", "visit"] }
walkdir = "2.5.0"
