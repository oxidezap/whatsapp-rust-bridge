name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A wasm release build plus wasm-opt is expensive; a new push to a pull request
# makes the run in flight pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24

jobs:
  fmt-clippy:
    name: Rust Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-05
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-and-test:
    # The benchmark step that used to run here invoked `bench:node`, whose
    # targets under benches/ were deleted in 157f43a. It never surfaced because
    # this workflow only triggered on master; pointing it at main would have
    # failed every run on MODULE_NOT_FOUND. The `bench` scripts in package.json
    # are still orphaned and want either restoring or removing.
    name: Build + Test (Bun)
    runs-on: ubuntu-latest
    needs: fmt-clippy
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-05
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build WASM package
        run: |
          wasm-pack build --target web --out-dir pkg --release
          # Fix .gitignore issue in pkg (wasm-pack includes it by default)
          rm -f pkg/.gitignore

      - name: Run TypeScript compilation (generate .d.ts)
        run: bun run build:ts

      - name: Run Tests with Bun
        run: bun test
        env:
          # Optional: make test output clearer
          CI: true


  rust-tests:
    name: Rust Unit Tests (wasm32 / Node)
    runs-on: ubuntu-latest
    needs: fmt-clippy
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-05
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # `cargo test` can't run here: the crate only builds for wasm32, which has
      # no native test harness. `test:rust` (wasm-pack test --node) runs the
      # crate's `#[test]` unit tests (aliased to `#[wasm_bindgen_test]` in each
      # test module) on wasm32 inside Node, so CI flags regressions in the
      # pure-Rust logic (write-back cache, error mapping, …).
      - name: Run Rust unit tests (wasm32 in Node)
        run: bun run test:rust

  success:
    name: All checks passed
    if: success()
    needs: [fmt-clippy, build-and-test, rust-tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed!"
