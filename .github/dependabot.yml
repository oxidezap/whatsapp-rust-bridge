# Dependency updates arrive as a few batched pull requests, not one per crate.
# A run of this workflow's CI is a release wasm build plus wasm-opt, ~9 minutes;
# batching is what keeps a quiet week from spending an hour of runner on it.
# Configuration reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Two directories, not one: this is not a cargo workspace. The root crate and
  # `codegen/` are separate packages with separate lockfiles, and a single `/`
  # entry would leave `codegen/Cargo.lock` unmanaged — the package whose tests
  # pin the Rust-to-TypeScript type mapping.
  #
  # The groups below span both, so a bump that touches each still arrives as
  # one pull request.
  - package-ecosystem: cargo
    directories:
      - /
      - /codegen
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      # The routine weekly batch: one PR, one CI run, one merge.
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Majors ride in their own PR so a breaking bump that needs code changes
      # never holds the routine batch hostage. They stay grouped rather than
      # one-per-crate because most of this tree is 0.x, where Dependabot counts
      # 0.24 -> 0.25 as a *minor* update even though Cargo treats it as
      # breaking; splitting on the semver position alone would not buy the
      # isolation it looks like it buys, so the split is only about keeping the
      # rare loud PR separate from the quiet one.
      cargo-major:
        patterns:
          - "*"
        update-types:
          - major

  # Not previously configured, and the workflows show the drift that allows:
  # `taiki-e/install-action` and `oven-sh/setup-bun` are pinned by SHA while
  # `actions/checkout` and `actions/setup-node` ride a major tag. One weekly PR
  # keeps them moving together. SHA pins are updated in place, with the version
  # carried in the trailing comment that is already there.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  # npm/bun is deliberately left out, and this is not an oversight.
  #
  # Bun is the installer everywhere here — `bun install` in ci.yml and
  # release.yml — and Bun turns on --frozen-lockfile by default when CI is set.
  # `bun.lock` and `package-lock.json` are both committed, and Dependabot's npm
  # updater writes only the latter: a dependency bump would land package.json
  # and package-lock.json changed, bun.lock untouched, and every job would fail
  # its install before running a line of the build. The `bun` ecosystem is the
  # other half of the same problem — it rewrites lockfile fields it does not
  # understand:
  # https://github.com/dependabot/dependabot-core/issues/13623
  # https://github.com/dependabot/dependabot-core/issues/15848
  #
  # The exposure is small: six devDependencies, no runtime dependency at all.
  # Add an entry here once one updater can write both lockfiles in one commit.
