name: Diagnose npm OIDC

# Temporary. Reproduces the publish job's environment and permissions without
# publishing, to tell "npm never attempted OIDC" apart from "npm attempted it
# and the registry refused". Delete once the publish path is proven.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # `:+set` prints a marker, never the value: the OIDC request token is a
      # credential.
      - name: Report what publish would see
        run: |
          echo "node            $(node --version)"
          echo "npm             $(npm --version)  ($(command -v npm))"
          echo "OIDC url        ${ACTIONS_ID_TOKEN_REQUEST_URL:+set}${ACTIONS_ID_TOKEN_REQUEST_URL:-MISSING}"
          echo "OIDC token      ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-MISSING}"
          echo "registry        $(npm config get registry)"
          echo "--- npmrc files ---"
          for f in ./.npmrc ~/.npmrc /usr/local/etc/npmrc; do
            [ -f "$f" ] && { echo "$f:"; sed 's/=.*/=<redacted>/' "$f"; } || echo "$f: absent"
          done

      # The real question: with no token anywhere, does npm reach for the OIDC
      # exchange or go straight to ENEEDAUTH?
      - name: Dry-run publish
        run: npm publish --dry-run --ignore-scripts 2>&1 | tail -25
