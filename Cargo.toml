[package]
name = "whatsapp-rust-bridge"
version = "0.1.0"
edition = "2024"

# The BoltFFI exposure crate is a member but not a default member: a plain
# `cargo build` here must not need the `boltffi` toolchain installed.
[workspace]
members = [".", "crates/bridge-core", "crates/bridge-boltffi"]
default-members = [".", "crates/bridge-core"]
exclude = ["codegen"]

[workspace.dependencies]
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", branch = "main", default-features = false, features = [
    "danger-skip-cert-chain-verify",
    "legacy-session-interop",
] }
whatsapp-rust-bridge-core = { path = "crates/bridge-core" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O4",
    "--gufa-optimizing",
    "--inlining-optimizing",
    "--ignore-implicit-traps",
    "--traps-never-happen",
    "--coalesce-locals-learning",
    "--converge",
    # Enable modern WASM features for better optimization
    "--enable-simd",
    "--enable-bulk-memory",
    "--enable-nontrapping-float-to-int",
    "--enable-sign-ext",
    "--enable-mutable-globals",
    "--enable-multivalue",
    # Additional optimization passes
    "--fast-math",
    "--zero-filled-memory",
    "--dce",
    "--vacuum",
    "--directize",
    "--optimize-stack-ir",
    # Folds near-identical function bodies (proto codegen monomorphizations)
    # into shared parameterized ones. Only cold, structurally-similar code
    # merges, so speed-critical paths keep their dedicated bodies.
    "--merge-similar-functions",
    "--strip-debug",
]

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
audio = ["dep:symphonia"]
image = ["dep:image"]
sticker = ["dep:img-parts"]
# Diagnostics-only counting allocator and scoped history-sync attribution.
# Kept out of production builds because every allocation pays counter overhead.
# The core's own tracing metadata supplies task names; the bridge never mirrors
# its operation list.
memory-profiling = ["dep:tracing", "dep:tracing-core", "whatsapp-rust/tracing"]

[dependencies]
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-lock = { version = "3", default-features = false }
async-trait = "0.1.89"
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
bytes = { version = "1.11", default-features = false }
console_error_panic_hook = "0.1"
console_log = { version = "1", features = ["color"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
# Ensure all getrandom usages (including via rand in whatsapp-rust) get wasm_js support
# This doesn't modify whatsapp-rust — Cargo unifies features across the dependency graph
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
], optional = true }

img-parts = { version = "0.4", default-features = false, optional = true }
js-sys = "0.3"
log = "0.4"
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
symphonia = { version = "0.6.0", default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "ogg",
], optional = true }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-core = { version = "0.1.36", default-features = false, features = ["std"], optional = true }
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
uuid = { version = "1.23.1", default-features = false, features = ["v4", "js"] }

wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
wasm-streams = "0.6"
web-sys = { version = "0.3", features = [
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "Window",
] }
whatsapp-rust = { workspace = true }
whatsapp-rust-bridge-core = { workspace = true }

# Runs the crate's `#[test]` unit tests on wasm32 in Node via
# `wasm-pack test --node` — plain `cargo test` can't, because the crate only
# builds for wasm32 (no native test harness). The test modules alias
# `#[test]` -> `#[wasm_bindgen_test]`, so there is no per-test annotation churn.
[dev-dependencies]
flate2 = "1"
wasm-bindgen-test = "0.3"

[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true

# History sync inflates each retained blob once for core extraction and once
# for bounded consumer streaming. Size-oriented codegen was measurably slower
# in this dependency, so keep the bridge compact while optimizing the inflater's
# hot loops for speed.
[profile.release.package.zlib-rs]
opt-level = 3

# Large encrypted media (including downloaded history-sync chunks) stays on
# the allocation-preserving Rust CBC path. Optimize that narrowly-scoped hot
# stack without applying speed-oriented codegen to the whole WASM graph.
[profile.release.package.wacore-libsignal]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.cbc]
opt-level = 3
[profile.release.package.cipher]
opt-level = 3
[profile.release.package.inout]
opt-level = 3

# Keep the bounded inflater wrapper and binary framing on the same
# speed-oriented codegen as zlib itself. Higher-level core/client crates remain
# size-optimized; promoting them increased resident memory disproportionately.
[profile.release.package.wacore-binary]
opt-level = 3

# Every ratchet step runs a scalar multiplication, so this field arithmetic is
# the single most expensive thing on the per-message path. Its neighbours on
# that path (sha2, subtle, digest) measured flat and stay size-optimized.
[profile.release.package.curve25519-dalek]
opt-level = 3

# Optimized with function names for profiling: bun run build:profile
[profile.profiling]
inherits = "release"
strip = false
debug = 2
lto = false
