[package]
name = "ffi-size-bindgen"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
whatsapp-rust-bridge-core = { workspace = true }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
tsify = { version = "0.5.6", default-features = false, features = ["js"] }

[dev-dependencies]
flate2 = "1"
wasm-bindgen-test = "0.3"
