name: Release

# Release PRs remain reviewable. Their merge creates a tag and a private draft;
# only verified npm publication makes the GitHub release public.
# Only feat/fix/perf trigger releases. Dependency fixes use fix(deps), not chore.
on:
  push:
    branches: [main]
  # Normally select the tag to retry its workflow. For a broken test/workflow
  # stored in an older tag, select main and explicitly supply recovery_tag.
  # Recovery checks that every package/build input is unchanged since the tag;
  # provenance names this event's real main SHA and the tag is never moved.
  workflow_dispatch:
    inputs:
      recovery_tag:
        description: "Existing release tag to recover from main without changing package/build inputs"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One group for every release and recovery run, not one per ref: a recovery
# dispatched on a tag has a different `github.ref` than a release from main, so
# keying on it would let the two reach `npm publish` at the same time and race
# over which one `latest` ends up pointing at.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: nightly-2026-04-05
  NODE_VERSION: 24

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels the release PR, and PR labels go through the
      # issues API. Only matters on the GITHUB_TOKEN fallback path — the App
      # token below carries its own permissions.
      issues: write
    steps:
      # A pull request opened with GITHUB_TOKEN gets its checks queued in an
      # approval-required state, so the release PR sits there until a maintainer
      # clicks "Approve and run". An App installation token is the supported way
      # out: it is minted per run and expires in an hour, unlike the PAT the
      # same workaround used to require.
      #
      # Entirely optional — set the RELEASE_APP_CLIENT_ID variable and the
      # RELEASE_APP_PRIVATE_KEY secret to switch it on. Without them this falls
      # back to GITHUB_TOKEN and releases still work, they just need that click.
      # The App needs Contents, Pull requests and Issues: read and write.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits everything the App installation
          # holds, and job-level `permissions` do not constrain it. Scoping here
          # keeps this token narrow even if the App is later granted more for
          # some other purpose.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-metadata:
    name: Resolve the release draft
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Listing drafts requires push access. No build code or OIDC runs here.
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      id: ${{ steps.resolve.outputs.id }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag-sha: ${{ steps.resolve.outputs.tagSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Release Please does not repeat creation outputs on a retry. Resolve the
      # existing draft by version and immutable event SHA instead.
      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: node .github/scripts/release.mjs resolve

  # Split from publish on purpose: this is where the test suites and the wasm
  # toolchain run, and none of it should be able to reach an OIDC token. It is
  # also where the published tree is built — `publish` downloads it rather than
  # rebuilding, so the job holding the token runs no compiler and no build
  # script at all.
  verify:
    name: Verify the release tag
    needs: release-metadata
    if: ${{ !cancelled() && needs.release-metadata.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always the event SHA: npm provenance attests this exact commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # protoc is needed because `bun run build` regenerates the proto
          # codec. Pinned to the same versions ci.yml uses, so a break shows up
          # on a pull request; and pinned at all because publish can start much
          # later than verify, behind the environment gate, where a new default
          # would generate one codec for the tests and another for the tarball.
          tool: wasm-pack,protoc@3.35.1

      # `bun run build` produces the BoltFFI artifact and `bun test` imports it,
      # so verification needs the CLI as much as CI does. Pinned to the version
      # the backend compiles against: the generator and the macro agree on wasm
      # symbol names only within a version.
      - name: Install boltffi
        run: cargo install boltffi_cli --version 0.30.0 --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install

      # Whether or not the release PR got its checks approved, the tag faces the
      # same bar as a normal pull request before anything reaches npm.
      #
      # That bar is this job alone now. ci.yml skips a diff that is only a
      # version bump, which is exactly what release-please's commit is, so the
      # checks below are no longer a second opinion running beside CI's — they
      # are the only opinion on the commit being published. Everything ci.yml
      # runs is therefore run here too, including the reduced feature sets and
      # the codegen package that used to be CI's alone.
      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo clippy (reduced feature sets)
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features \
            --features client-signal,client-media -- -D warnings

      - name: Codegen format, lints and unit tests
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          cargo fmt --manifest-path codegen/Cargo.toml --all -- --check
          cargo clippy --manifest-path codegen/Cargo.toml --all-targets --target "$HOST" -- -D warnings
          cargo test --manifest-path codegen/Cargo.toml --target "$HOST"

      # This is the build that ships. `publish` used to run its own; it now
      # takes the tree this step produced, so the artifact the checks below
      # measure is the artifact npm receives rather than a second build of the
      # same source. That distinction is not academic here — two builds of an
      # unchanged tree differ by tens of kilobytes (#62), so every number
      # measured before was measured on bytes nobody shipped.
      - name: Build the wasm package
        run: bun run build

      # `bun run build` regenerates these. If what it produced differs from what
      # is committed, the tarball's .d.ts would not be the reviewed one — which
      # is how a build with missing sources shipped a .d.ts referencing types it
      # no longer declared. `ts/generated` is checked for the same reason ci.yml
      # checks it: an upstream schema change has to show up in a diff.
      - name: Fail if the generated types drifted
        run: |
          git add --intent-to-add -- src/generated_types.rs ts/generated
          git diff --exit-code -- src/generated_types.rs ts/generated

      # Same production-profile gate as ci.yml: this tree is what publish
      # ships, so the bypass must not be in the graph it was built from.
      - name: Fail if the Noise cert bypass reached the build
        run: sh scripts/check-noise-cert-profile.sh

      - run: bun test

      - name: Rust unit tests (wasm32 in Node)
        run: bun run test:rust

      # The three publish guards, run here because here is where the bytes are
      # made. `check:size` and `check:wasm-shape` also run in `publish` against
      # the downloaded tree; they are cheap, and a gate on the artifact is worth
      # having on both sides of the hand-off.
      - name: Check the tarball contents
        run: bun run scripts/check-pack.ts

      - name: Check the tarball size
        run: bun run check:size

      - name: Check the wasm's largest function
        run: bun run check:wasm-shape

      # Check the downloaded build tree before running its package guards.
      # The packed archive below also covers package.json, README and LICENSE;
      # its SHA512 is checked before publishing and before finalizing GitHub.
      - name: Record the tree publish must ship
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0r sha256sum) > dist.sha256
          cat dist.sha256

      - name: Pack the exact archive npm must receive
        run: node .github/scripts/release.mjs pack

      - id: artifact-name
        run: echo "name=npm-tarball-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Hand the verified build to publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            dist
            dist.sha256
            release-package.tgz
            release-package.json
          if-no-files-found: error
          # Long enough to survive a `npm-publish` approval that waits
          # overnight, short enough that a build nobody published expires.
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [release-metadata, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate for the publish step: add required reviewers here to make releases
    # need a second pair of eyes, and to scope the OIDC trust on npm.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights. No
      # long-lived NPM_TOKEN lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same immutable commit verify checked out and vouched for. Pinned by
          # sha so retargeting the tag while this job waits on the environment
          # approval cannot change what gets published.
          ref: ${{ github.sha }}
          # Nothing here talks to the remote after checkout, and the steps below
          # run bun and npm in a job holding OIDC publish rights. Don't leave the
          # token in .git/config for them.
          persist-credentials: false

      # This job used to rebuild the wasm from scratch — 7m12s of the 7m47s it
      # took at 0.15.0, and the whole Rust and wasm toolchain executing next to the
      # OIDC token because `files` ships `dist/` and `dist/` is gitignored.
      # Taking verify's tree instead is both faster and narrower: no cargo, no
      # wasm-pack, no protoc, no build scripts in the privileged job, and the
      # bytes npm receives are the bytes that passed the tests.
      #
      # Provenance is unaffected. npm attests the workflow, repository, ref and
      # commit of the run that published — and `verify` is a job in this run, at
      # this commit. If anything, it is now more accurate: it used to attest a
      # build nothing had tested.
      - name: Take the build verify vouched for
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm >= 11.5.1, above what some Node 24 releases
      # bundle. Pinned rather than `@latest`: this binary performs the publish
      # with the OIDC token, so it is part of the privileged path and a floating
      # tag would put unreviewed code there.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # An artifact round-trip is a zip and an unzip, and neither is something
      # to take on trust when the output is a published version. Same digests,
      # same file set, or nothing is published.
      - name: Fail unless the tree is byte-for-byte verify's
        run: |
          set -euo pipefail
          (cd dist && find . -type f -print0 | sort -z | xargs -0r sha256sum) > dist.actual
          diff -u dist.sha256 dist.actual
          echo "publish: $(wc -l < dist.actual) files match the digests verify recorded"

      - run: bun install --ignore-scripts

      # `--ignore-scripts` below suppresses the prepack hook, and prepack is
      # where the tarball guard lives — run it directly so a build that leaks
      # pkg/ or duplicate files still fails before publishing.
      - name: Check the tarball contents
        run: bun run scripts/check-pack.ts

      # Recheck the downloaded build tree before publishing its packed archive.
      - name: Check the tarball size
        run: bun run check:size

      # And the shape inside it: `dist/whatsapp_rust_bridge_bg.wasm` rather than
      # the `pkg/` copy the script defaults to, because `pkg/` is a build
      # artifact this job no longer produces. `build:ts` copies one to the
      # other, so it is the same wasm — and this one is the one that ships.
      - name: Check the wasm's largest function
        run: bun run check:wasm-shape dist/whatsapp_rust_bridge_bg.wasm

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing authenticates
      # over OIDC and attaches provenance on its own.
      - name: Publish the verified archive, or confirm the identical version
        run: node .github/scripts/release.mjs publish

  finalize:
    name: Publish the GitHub release
    needs: [release-metadata, verify, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: .
      # Retry failed jobs if npm succeeded but this step failed. Rebuilding can
      # change wasm bytes, and an existing version with different bytes fails
      # closed. This job has no npm OIDC rights and never republishes npm.
      - name: Confirm npm integrity before making the draft public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release-metadata.outputs.id }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          RELEASE_TAG_SHA: ${{ needs.release-metadata.outputs.tag-sha }}
        run: node .github/scripts/release.mjs finalize
