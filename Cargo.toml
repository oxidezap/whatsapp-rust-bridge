# Workspace virtual: substitui o antigo crate WASM (preservado em git + em
# docs/napi-migration/Cargo.toml.wasm-reference). O código wasm em `src/` permanece
# como referência de port; não é mais compilado.
[workspace]
resolver = "2"
members = ["crates/bridge-core", "crates/bridge-napi"]

[workspace.package]
edition = "2024"
version = "0.6.0-alpha.36"
license = "MIT"
authors = ["João Lucas <jlucaso@hotmail.com>"]

[workspace.dependencies]

# --- shared ---
anyhow = "1"
async-channel = "2.5.0"
async-trait = "0.1.89"
bytes = "1"
futures = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
# --- whatsapp-rust core, pinado por commit (nativo: SEM o feature wasm-only `js`) ---
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b", features = ["danger-skip-cert-chain-verify"] }
wacore-appstate = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b" }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b", features = ["serde"] }
wacore-libsignal = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b" }
waproto = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3cfe78c95b640a284b1bf947e373a29f19c1cc3b", default-features = false, features = ["debug-diagnostics", "tokio-runtime", "tokio-native"] }

# Perfis governam TODO o grafo (incl. deps git) quando este workspace é a raiz.
# `panic = "abort"` (igual ao core whatsapp-rust e ao build wasm anterior): remove
# as tabelas de unwinding, encolhendo bastante o `.node`. Trade-off: um panic Rust
# aborta o processo em vez de virar exceção JS (mesmo comportamento do wasm antigo).
# `lto = "fat"` + `opt-level = "s"`: otimização equilibrada tamanho/velocidade. Um
# cdylib napi exporta os ~100 métodos (menos dead-code-elimination que um EXE), então
# "s" encolhe bem sem o cliff de perf do "z". (Troque p/ "z" se quiser o menor tamanho.)
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
