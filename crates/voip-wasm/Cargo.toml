[package]
name = "whatsapp-rust-voip"
version = "0.1.0"
edition = "2024"

# The second WASM: the OZVP engine side. It speaks the versioned `voip-abi`
# binary protocol with the bridge's core module and drives `wacore`'s call
# engine on a wasm runtime. It must never name the WhatsApp client: the
# crate depends on `wacore` (engine, MLOW codec, wasm getrandom), never on
# `whatsapp-rust` (client). CI asserts that `cargo tree` shows no
# `whatsapp-rust` entry for this crate.
[dependencies]
voip-abi = { path = "../voip-abi" }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "c4dc16d223917d1aab759e9828f6ea82904f0c99", default-features = false, features = ["voip", "voip-mlow", "js"] }
wacore-binary = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "c4dc16d223917d1aab759e9828f6ea82904f0c99" }
anyhow = { version = "1.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-trait = "0.1.89"
bytes = { version = "1.11", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await", "executor", "std"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
name = "whatsapp_rust_voip"
