name: Release

# release-please keeps a release PR up to date with every conventional commit
# landing on main. Merging that PR tags the release, which is the only thing
# that triggers a publish — so the version bump stays reviewable instead of
# firing on each merge.
#
# Commit types matter now: only feat/fix/perf produce a release. A `chore(deps):
# …` bump of the whatsapp-rust pin releases nothing and would sit on main until
# an unrelated commit dragged it out — commit those as `fix(deps): …` instead.
on:
  push:
    branches: [main]
  # Recovery path. A release tag is created by the job below and only that run
  # carries `release_created`, so a publish that fails for a reason outside the
  # tag — a missing tool on the runner, a registry outage — cannot be retried by
  # re-running it: the re-run replays the workflow file of that commit, which is
  # the one that failed.
  #
  # Dispatch this **with the release tag selected as the ref**, not from a
  # branch with the tag as a parameter. Taking it as a free-form input would let
  # a dispatch publish any branch or commit through a job holding npm OIDC
  # rights, and npm's provenance records the event's ref and sha rather than
  # whatever the workspace was checked out to — so a tarball built from a tag
  # while the event pointed at a branch would be attested to the wrong commit.
  # The ref picker only offers refs that exist, and `ref_type` below rejects
  # everything that is not a tag.
  #
  # The consequence, which is the price of the above: a dispatch runs the
  # workflow file stored in the selected tag, so this only rescues tags created
  # from this commit onwards. A tag older than this file has no dispatch trigger
  # to select and cannot be recovered here — delete it along with its GitHub
  # release and let the next release supersede it, since a tag that never
  # reached npm has nothing depending on it.
  workflow_dispatch:

permissions:
  contents: read

# One group for every release and recovery run, not one per ref: a recovery
# dispatched on a tag has a different `github.ref` than a release from main, so
# keying on it would let the two reach `npm publish` at the same time and race
# over which one `latest` ends up pointing at.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: nightly-2026-04-05
  NODE_VERSION: 24

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels the release PR, and PR labels go through the
      # issues API. Only matters on the GITHUB_TOKEN fallback path — the App
      # token below carries its own permissions.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # The commit the release was tagged at. Not necessarily the commit that
      # triggered this run: if the run for a release PR merge fails or is
      # superseded, a later push is what creates the release, and the tag then
      # names the earlier merge.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A pull request opened with GITHUB_TOKEN gets its checks queued in an
      # approval-required state, so the release PR sits there until a maintainer
      # clicks "Approve and run". An App installation token is the supported way
      # out: it is minted per run and expires in an hour, unlike the PAT the
      # same workaround used to require.
      #
      # Entirely optional — set the RELEASE_APP_CLIENT_ID variable and the
      # RELEASE_APP_PRIVATE_KEY secret to switch it on. Without them this falls
      # back to GITHUB_TOKEN and releases still work, they just need that click.
      # The App needs Contents, Pull requests and Issues: read and write.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without these the token inherits everything the App installation
          # holds, and job-level `permissions` do not constrain it. Scoping here
          # keeps this token narrow even if the App is later granted more for
          # some other purpose.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Split from publish on purpose: this is where the test suites and the wasm
  # toolchain run, and none of it should be able to reach an OIDC token. It is
  # also where the published tree is built — `publish` downloads it rather than
  # rebuilding, so the job holding the token runs no compiler and no build
  # script at all.
  verify:
    name: Verify the tag
    needs: release-please
    # `!cancelled()` rather than `always()`: the dispatch path needs this to run
    # past a skipped release-please, but a cancelled run must not go on to
    # publish.
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A sha, never a ref: a ref can move between this checkout and
          # publish's, leaving the two jobs on different trees. On the push path
          # that is the commit the release was tagged at, which is not always
          # the one that triggered the run; on dispatch the event's sha is the
          # tag's own commit.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false

      # `ref_type == 'tag'` only proves the ref is a tag, not that it is a
      # release. Without this, anyone able to push a tag could point the job
      # holding npm OIDC rights at arbitrary code, bypassing main entirely.
      # A GitHub release is what release-please creates and what a hand-pushed
      # tag does not have; the version match then ties the tag to the tree.
      - name: Confirm the dispatch targets a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A GitHub release proves nothing on its own: anyone with write access
          # can tag arbitrary code and attach a release record to it by hand.
          # Reachability from main is what ties this commit to the protected
          # branch it had to pass through, so check that first.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical | behind) ;;
            *)
              echo "::error::$TAG is at a commit that is not on main ($status)"
              exit 1
              ;;
          esac

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG has no GitHub release; only release tags can be published"
            exit 1
          fi

          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::$TAG does not match package.json version $version"
            exit 1
          fi

          # npm refuses to apply `latest` implicitly once the registry holds a
          # higher version, so a recovery attempted after a newer release would
          # fail at the publish step — after the whole build. Say so here.
          name=$(jq -r .name package.json)
          latest=$(npm view "$name" version 2>/dev/null || true)
          if [ -n "$latest" ] && [ "$latest" != "$version" ] &&
             [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" = "$latest" ]; then
            echo "::error::$name@$latest is already published; $version cannot take latest implicitly"
            exit 1
          fi

      # Guards the assumption on the push path: release-please tags the commit
      # it just merged, so a tag pointing elsewhere means this run would verify
      # and publish something the release does not name.
      - name: Confirm the release tag points at this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG was tagged at $RELEASE_SHA but this event is $GITHUB_SHA;"
            echo "::error::provenance would name the wrong commit. Dispatch this workflow on $TAG instead."
            exit 1
          fi

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          target=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = tag ]; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" --jq '.object.sha')
          fi
          if [ "$target" != "$RELEASE_SHA" ]; then
            echo "::error::$TAG points at $target, not $RELEASE_SHA"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          # protoc is needed because `bun run build` regenerates the proto
          # codec. Pinned to the same versions ci.yml uses, so a break shows up
          # on a pull request; and pinned at all because publish can start much
          # later than verify, behind the environment gate, where a new default
          # would generate one codec for the tests and another for the tarball.
          tool: wasm-pack,protoc@3.35.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: bun install

      # Whether or not the release PR got its checks approved, the tag faces the
      # same bar as a normal pull request before anything reaches npm.
      #
      # That bar is this job alone now. ci.yml skips a diff that is only a
      # version bump, which is exactly what release-please's commit is, so the
      # checks below are no longer a second opinion running beside CI's — they
      # are the only opinion on the commit being published. Everything ci.yml
      # runs is therefore run here too, including the reduced feature sets and
      # the codegen package that used to be CI's alone.
      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo clippy (reduced feature sets)
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features \
            --features client-signal,client-media -- -D warnings

      - name: Codegen format, lints and unit tests
        run: |
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          cargo fmt --manifest-path codegen/Cargo.toml --all -- --check
          cargo clippy --manifest-path codegen/Cargo.toml --all-targets --target "$HOST" -- -D warnings
          cargo test --manifest-path codegen/Cargo.toml --target "$HOST"

      # This is the build that ships. `publish` used to run its own; it now
      # takes the tree this step produced, so the artifact the checks below
      # measure is the artifact npm receives rather than a second build of the
      # same source. That distinction is not academic here — two builds of an
      # unchanged tree differ by tens of kilobytes (#62), so every number
      # measured before was measured on bytes nobody shipped.
      - name: Build the wasm package
        run: bun run build

      # `bun run build` regenerates these. If what it produced differs from what
      # is committed, the tarball's .d.ts would not be the reviewed one — which
      # is how a build with missing sources shipped a .d.ts referencing types it
      # no longer declared. `ts/generated` is checked for the same reason ci.yml
      # checks it: an upstream schema change has to show up in a diff.
      - name: Fail if the generated types drifted
        run: |
          git add --intent-to-add -- src/generated_types.rs ts/generated
          git diff --exit-code -- src/generated_types.rs ts/generated

      - run: bun test

      - name: Rust unit tests (wasm32 in Node)
        run: bun run test:rust

      # The three publish guards, run here because here is where the bytes are
      # made. `check:size` and `check:wasm-shape` also run in `publish` against
      # the downloaded tree; they are cheap, and a gate on the artifact is worth
      # having on both sides of the hand-off.
      - name: Check the tarball contents
        run: bun run scripts/check-pack.ts

      - name: Check the tarball size
        run: bun run check:size

      - name: Check the wasm's largest function
        run: bun run check:wasm-shape

      # What `publish` has to receive intact. `dist/` is the whole package
      # (`files` is `dist/**/*`), so this digest set is the tarball, and
      # comparing it after the download is what makes "publish ships what
      # verify vouched for" a checked claim rather than a description of the
      # plumbing.
      - name: Record the tree publish must ship
        run: |
          (cd dist && find . -type f -print0 | sort -z | xargs -0r sha256sum) > dist.sha256
          cat dist.sha256

      - name: Hand the verified build to publish
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: npm-tarball
          path: |
            dist
            dist.sha256
          if-no-files-found: error
          # Long enough to survive a `npm-publish` approval that waits
          # overnight, short enough that a build nobody published expires.
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [release-please, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate for the publish step: add required reviewers here to make releases
    # need a second pair of eyes, and to scope the OIDC trust on npm.
    environment: npm-publish
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights. No
      # long-lived NPM_TOKEN lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same immutable commit verify checked out and vouched for. Pinned by
          # sha so retargeting the tag while this job waits on the environment
          # approval cannot change what gets published.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          # Nothing here talks to the remote after checkout, and the steps below
          # run bun and npm in a job holding OIDC publish rights. Don't leave the
          # token in .git/config for them.
          persist-credentials: false

      # This job used to rebuild the wasm from scratch — 7m12s of the 7m47s it
      # took at 0.15.0, and the whole Rust and wasm toolchain executing next to the
      # OIDC token because `files` ships `dist/` and `dist/` is gitignored.
      # Taking verify's tree instead is both faster and narrower: no cargo, no
      # wasm-pack, no protoc, no build scripts in the privileged job, and the
      # bytes npm receives are the bytes that passed the tests.
      #
      # Provenance is unaffected. npm attests the workflow, repository, ref and
      # commit of the run that published — and `verify` is a job in this run, at
      # this commit. If anything, it is now more accurate: it used to attest a
      # build nothing had tested.
      - name: Take the build verify vouched for
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-tarball
          path: .

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing needs npm >= 11.5.1, above what some Node 24 releases
      # bundle. Pinned rather than `@latest`: this binary performs the publish
      # with the OIDC token, so it is part of the privileged path and a floating
      # tag would put unreviewed code there.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.19.0

      # An artifact round-trip is a zip and an unzip, and neither is something
      # to take on trust when the output is a published version. Same digests,
      # same file set, or nothing is published.
      - name: Fail unless the tree is byte-for-byte verify's
        run: |
          set -euo pipefail
          (cd dist && find . -type f -print0 | sort -z | xargs -0r sha256sum) > dist.actual
          diff -u dist.sha256 dist.actual
          echo "publish: $(wc -l < dist.actual) files match the digests verify recorded"

      - run: bun install --ignore-scripts

      # `--ignore-scripts` below suppresses the prepack hook, and prepack is
      # where the tarball guard lives — run it directly so a build that leaks
      # pkg/ or duplicate files still fails before publishing.
      - name: Check the tarball contents
        run: bun run scripts/check-pack.ts

      # And its size, measured on the tree about to be packed.
      - name: Check the tarball size
        run: bun run check:size

      # And the shape inside it: `dist/whatsapp_rust_bridge_bg.wasm` rather than
      # the `pkg/` copy the script defaults to, because `pkg/` is a build
      # artifact this job no longer produces. `build:ts` copies one to the
      # other, so it is the same wasm — and this one is the one that ships.
      - name: Check the wasm's largest function
        run: bun run check:wasm-shape dist/whatsapp_rust_bridge_bg.wasm

      # No NODE_AUTH_TOKEN and no --provenance: trusted publishing authenticates
      # over OIDC and attaches provenance on its own.
      - run: npm publish --ignore-scripts
